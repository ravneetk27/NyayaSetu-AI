services:
  - type: web
    name: nyayasetu-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OLLAMA_URL
        sync: false
      - key: LLM_MODEL
        value: llama3.2:1b
