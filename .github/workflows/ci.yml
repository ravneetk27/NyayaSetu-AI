name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8 & dependencies
        run: |
          pip install flake8
          pip install -r backend/requirements.txt

      - name: Run flake8 on backend/app/
        run: |
          flake8 backend/app/ \
            --max-line-length=120 \
            --ignore=E501,W503 \
            --statistics

  # ── Job 2: Docker build & smoke test ────────────────────────────────────────
  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nyayasetu-ai:ci .

      - name: Start container
        run: |
          docker run -d \
            --name nyayasetu-test \
            -e GROQ_API_KEY=test_key_for_ci \
            -e ENV=production \
            -p 8000:8000 \
            nyayasetu-ai:ci

      - name: Wait for server to boot
        run: sleep 20

      - name: Smoke test /health endpoint
        run: |
          curl --fail --silent --show-error http://localhost:8000/health \
            || (echo "Health check failed. Container logs:" && docker logs nyayasetu-test && exit 1)

      - name: Stop & remove container
        if: always()
        run: docker rm -f nyayasetu-test
